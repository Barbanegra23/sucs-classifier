name: Tests

# Corre en cada push a master y en cada Pull Request hacia master.
# Así, si algo rompe un test, se ve en GitHub antes de mezclar el cambio.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código (flutter analyze)
        run: flutter analyze

      - name: Correr tests (flutter test)
        run: flutter test
